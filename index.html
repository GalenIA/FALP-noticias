function filtradas(){
  const q=$("#q").value.toLowerCase().trim(), tema=$("#ftema").value, dias=parseInt($("#dias").value,10);
  let arr=NOTICIAS.slice();
  if(tema) arr=arr.filter(n=>n.tema===tema);

  const orden=$("#orden").value;

}

  const filas=Object.entries(c).sort((a,b)=>b[1]-a[1]);

    const r=n.relevancia_falp||0;
    const tit=n.url? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.titulo)}</a>` : esc(n.titulo);
    return `<div class="noticia">
      <div class="meta">

}
function sparkline(vals){

  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-((v-min)/rng)*h).toFixed(1)}`).join(" ");

}

  const ultima=fechas[fechas.length-1];
  const porRiesgo={}; RIESGOS.forEach(r=>{(porRiesgo[r.riesgo]=porRiesgo[r.riesgo]||[]).push(r);});
  const ultimos=RIESGOS.filter(r=>r.fecha===ultima).slice().sort((a,b)=>b.indice-a.indice);
  document.querySelector("#card-riesgos h2").textContent="Mapa de riesgos estratégicos · "+ultima;
  cont.innerHTML=ultimos.map(r=>{
    const v=idx100(r.indice);
    const serie=(porRiesgo[r.riesgo]||[]).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(s=>idx100(s.indice));
    const spark=fechas.length>1?sparkline(serie):"";
    return `<div class="riesgo">
      <div class="riesgo-cab"><span class="riesgo-nom">${esc(r.riesgo)}</span><span class="riesgo-val" style="color:${color(v)}">${v}<span class="riesgo-nivel"> · ${nivel(v)}</span></span></div>
      <div class="riesgo-bar-wrap"><span class="riesgo-bar" style="width:${v}%;background:${color(v)}"></span></div>
      <div class="riesgo-meta">${r.n_noticias} noticias · relevancia prom ${r.relevancia_prom} ${spark}</div>
    </div>`;
  }).join("");
  const nota=fechas.length<=1?"Foto del día; la línea de tendencia aparece al acumular más días.":"";
  cont.innerHTML+=`<div class="riesgo-nota">Índice 0-100: combina volumen de cobertura y relevancia (100 ≈ jornada saturada por ese riesgo). ${nota}</div>`;
}
function render(){const arr=filtradas();pintarGrafico(arr);pintarLista(arr);}
pintarResumen(); pintarRiesgos(); poblarTemas();
["q","ftema","orden","dias"].forEach(id=>$("#"+id).addEventListener("input",render));
render();
</script>
</body>
</html>
