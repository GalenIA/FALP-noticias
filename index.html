", "riesgo": "Políticas Públicas", "indice": 184, "n_noticias": 2, "relevancia_prom": 92}, {"fecha": "2026-08-14", "riesgo": "Reputación FALP", "indice": 73, "n_noticias": 1, "relevancia_prom": 73}];
const $ = s => document.querySelector(s);
const fechaN = x => x.fecha_publicacion || x.fecha_ingesta || "";
const relClase = r => r>=70?"rel-alta":r>=40?"rel-media":"rel-baja";
const esc = s => (s==null?"":String(s)).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const LBL = {regulacion:"Políticas Públicas",competencia:"Otros prestadores",financiamiento:"Financiamiento",reputacion:"Reputación FALP",oncologia_clinica:"Oncología clínica",otro:"Otro"};
const label = t => LBL[t] || t;

function pintarResumen(){
  const hoyN = NOTICIAS.filter(n=>n.fecha_ingesta===ANALISIS.fecha).length;
  const temas = (ANALISIS.temas_top||[]).map(t=>`<span class="badge tema">${esc(label(t))}</span>`).join(" ");
  $("#resumen").innerHTML = `<h2>Resumen ejecutivo${ANALISIS.fecha?" · "+esc(ANALISIS.fecha):""}</h2>
    <p>${esc(ANALISIS.resumen)||"Aún no hay análisis. Corre la rutina diaria para generarlo."}</p>
    ${temas?`<div style="margin-top:10px">${temas}</div>`:""}
    <div class="kpis">
      <div class="kpi"><b>${NOTICIAS.length}</b><span>Noticias en memoria</span></div>
      <div class="kpi"><b>${ANALISIS.n_nuevas!=null?ANALISIS.n_nuevas:hoyN}</b><span>Nuevas (último día)</span></div>
      <div class="kpi"><b>${new Set(NOTICIAS.map(n=>n.tema).filter(Boolean)).size}</b><span>Temas cubiertos</span></div>
    </div>`;
}
function poblarTemas(){
  const sel=$("#ftema");
  [...new Set(NOTICIAS.map(n=>n.tema).filter(Boolean))].sort().forEach(t=>{
    const o=document.createElement("option");o.value=t;o.textContent=label(t);sel.appendChild(o);
  });
}
function filtradas(){
  const q=$("#q").value.toLowerCase().trim(), tema=$("#ftema").value, dias=parseInt($("#dias").value,10);
  let arr=NOTICIAS.slice();
  if(tema) arr=arr.filter(n=>n.tema===tema);
  if(dias>0){const lim=new Date();lim.setDate(lim.getDate()-dias);
    arr=arr.filter(n=>{const f=new Date(fechaN(n));return !isNaN(f)&&f>=lim;});}
  if(q) arr=arr.filter(n=>((n.titulo||"")+" "+(n.medio||"")+" "+(n.entidades||[]).join(" ")).toLowerCase().includes(q));
  const orden=$("#orden").value;
  arr.sort((a,b)=> orden==="fecha" ? fechaN(b).localeCompare(fechaN(a)) : (b.relevancia_falp-a.relevancia_falp));
  return arr;
}
function pintarGrafico(arr){
  const c={}; arr.forEach(n=>{const t=n.tema||"sin tema";c[t]=(c[t]||0)+1;});
  const max=Math.max(1,...Object.values(c));
  const filas=Object.entries(c).sort((a,b)=>b[1]-a[1]);
  $("#grafico").innerHTML = filas.length? filas.map(([t,n])=>`
    <div class="barra"><span class="lbl">${esc(label(t))}</span>
    <span class="val" style="width:${Math.round(n/max*70)}%"></span>
    <span class="n">${n}</span></div>`).join("") : `<div class="vacio">Sin datos</div>`;
}
function pintarLista(arr){
  if(!arr.length){$("#lista").innerHTML='<div class="card vacio">No hay noticias que coincidan con el filtro.</div>';return;}
  $("#lista").innerHTML=arr.map(n=>{
    const r=n.relevancia_falp||0;
    const tit=n.url? `<a href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.titulo)}</a>` : esc(n.titulo);
    return `<div class="noticia">
      <div class="meta">
        <span class="badge ${relClase(r)}">Relevancia ${r}</span>
        ${n.tema?`<span class="badge tema">${esc(label(n.tema))}</span>`:""}
        <span>${esc(n.medio)||"medio desconocido"}</span><span>·</span><span>${esc(fechaN(n))}</span>
      </div>
      <h3>${tit}</h3>
      <p>${esc(n.resumen)}</p>
    </div>`;
  }).join("");
}
function sparkline(vals){
  if(vals.length<2) return "";
  const w=80,h=18,max=Math.max(...vals,1),min=Math.min(...vals,0),rng=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-((v-min)/rng)*h).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="#004990" stroke-width="1.5"/></svg>`;
}
function pintarRiesgos(){
  const cont=$("#riesgos");
  if(!RIESGOS.length){cont.innerHTML='<div class="vacio">Aún no hay foto de riesgos. Corre: <code>python nucleo/memoria.py riesgos</code></div>';return;}
  const idx100=v=>Math.min(100,Math.round(v/10));
  const nivel=v=>v>=66?"Alto":v>=33?"Medio":"Bajo";
  const color=v=>v>=66?"#c0392b":v>=33?"#d68910":"#2c7fb8";
  const fechas=[...new Set(RIESGOS.map(r=>r.fecha))].sort();
  const ultima=fechas[fechas.length-1];
  const porRiesgo={}; RIESGOS.forEach(r=>{(porRiesgo[r.riesgo]=porRiesgo[r.riesgo]||[]).push(r);});
  const ultimos=RIESGOS.filter(r=>r.fecha===ultima).slice().sort((a,b)=>b.indice-a.indice);
  document.querySelector("#card-riesgos h2").textContent="Mapa de riesgos estratégicos · "+ultima;
  cont.innerHTML=ultimos.map(r=>{
    const v=idx100(r.indice);
    const serie=(porRiesgo[r.riesgo]||[]).slice().sort((a,b)=>a.fecha.localeCompare(b.fecha)).map(s=>idx100(s.indice));
    const spark=fechas.length>1?sparkline(serie):"";
    return `<div class="riesgo">
      <div class="riesgo-cab"><span class="riesgo-nom">${esc(r.riesgo)}</span><span class="riesgo-val" style="color:${color(v)}">${v}<span class="riesgo-nivel"> · ${nivel(v)}</span></span></div>
      <div class="riesgo-bar-wrap"><span class="riesgo-bar" style="width:${v}%;background:${color(v)}"></span></div>
      <div class="riesgo-meta">${r.n_noticias} noticias · relevancia prom ${r.relevancia_prom} ${spark}</div>
    </div>`;
  }).join("");
  const nota=fechas.length<=1?"Foto del día; la línea de tendencia aparece al acumular más días.":"";
  cont.innerHTML+=`<div class="riesgo-nota">Índice 0-100: combina volumen de cobertura y relevancia (100 ≈ jornada saturada por ese riesgo). ${nota}</div>`;
}
function render(){const arr=filtradas();pintarGrafico(arr);pintarLista(arr);}
pintarResumen(); pintarRiesgos(); poblarTemas();
["q","ftema","orden","dias"].forEach(id=>$("#"+id).addEventListener("input",render));
render();
</script>
